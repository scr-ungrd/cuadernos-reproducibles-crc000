jtex: v1
kind: typst
title: Plain Two-Column Article (unbranded)
description: >-
  Generic two-column academic article layout, adapted from the
  "cellpress-unofficial" Typst template with all Cell Press/Elsevier
  branding (logo, fixed journal name) removed.
template: template.typ

files:
  - template.typ
  - style.typ
  - subpar-wrap.typ
  - logo.svg
  - colab.svg

authors:
  - name: Subdirección para el Conocimiento del Riesgo (UNGRD)

version: 0.1.0
license: MIT

doc:
  - id: title
    required: true
  - id: authors
    required: true
  - id: affiliations
  - id: doi
  - id: keywords
  - id: date
  - id: license
  - id: github
  - id: open_access
  - id: bibliography

options:
  - id: version
    type: string
    description: Versión del cuaderno que se imprime en la portada (por ejemplo v2.0.0).
  - id: colab
    type: string
    description: URL del cuaderno en Google Colab; se imprime como icono con enlace en la portada.
  - id: titulo_breve
    type: string
    description: Título breve del encabezado de las páginas 2 en adelante (2–4 palabras).

parts:
  - id: abstract
    required: false
  - id: data_availability
    title: Data Availability
    required: false
  - id: keypoints
    required: false
    as_list: true
